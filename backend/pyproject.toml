[project]
name = "helperpay"
version = "0.1.0"
description = "Rivera Helper Pay backend: bill checker, household records, assistant"
readme = "README.md"
authors = [
    { name = "fengli", email = "thugasin@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic[bedrock]>=2.1.0",
    "bedrock-agentcore>=1.24.2",
    "boto3>=1.43.118",
    "pydantic>=2.14.1",
    "strands-agents>=1.62.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "botocore[crt]>=1.43.118",
    "openai>=3.37.0",
    "pytest>=9.1.1",
]
