name: Deploy

# Every merge to main is tested again, then deployed. The deploy job is the only
# thing in this repo that can get AWS credentials: the role it assumes trusts the
# "production" environment, which only main may deploy to (see README, CI/CD).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write   # OIDC: short-lived AWS credentials, no stored keys
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy
        run: npm run deploy
        env:
          SKIP_BOOTSTRAP: "1"          # bootstrapped once by `npm run setup:ci`
          MODEL_ID: ${{ vars.MODEL_ID }}
