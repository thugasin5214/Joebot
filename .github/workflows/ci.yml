name: CI

# Runs on every pull request (including the ones Claude opens) and before every deploy.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Backend tests (bill checker, confirmations, agent wiring, API)
        run: npm test

      - name: Web app builds
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      - name: Infrastructure synthesizes
        working-directory: infra
        run: npm ci --no-audit --no-fund && npx cdk synth --quiet
