<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="350" viewBox="0 0 1080 350" role="img" aria-label="Release pipeline in AWS: a change request goes to a coding agent that can only push to the proposed branch; the pipeline verifies it, deploys staging, waits for a person to approve, then deploys production and moves main."><title>Release pipeline in AWS: a change request goes to a coding agent that can only push to the proposed branch; the pipeline verifies it, deploys staging, waits for a person to approve, then deploys production and moves main.</title><style>
svg{color:#18221f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.box{fill:#ffffff;stroke:#5b6a65;stroke-width:1}
.box.acc{fill:#e2efeb;stroke:#1f6b5c;stroke-width:1.6}
.zone{fill:none;stroke:#5b6a65;stroke-opacity:.6;stroke-dasharray:6 5;stroke-width:1.2}
.t{font-size:13px;font-weight:600;fill:currentColor}
.s{font-size:11px;fill:#5b6a65}
.l{font-size:11px;fill:currentColor}
.acc.s,.acc.l{fill:#1f6b5c;font-weight:600}
.ln{fill:none;stroke:currentColor;stroke-width:1.2}
.ln.acc{stroke:#1f6b5c;stroke-width:2.2}
.ln.dash{stroke-dasharray:5 4}
.accfill{fill:#1f6b5c}
@media (prefers-color-scheme: dark){
svg{color:#e3ebe8}
.box{fill:#18211e;stroke:#94a59f}
.box.acc{fill:#1d3530;stroke:#6cc4ae}
.zone{stroke:#94a59f}
.s{fill:#94a59f}
.acc.s,.acc.l{fill:#6cc4ae}
.ln.acc{stroke:#6cc4ae}
.accfill{fill:#6cc4ae}
}
</style><defs><marker id="cd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker><marker id="cd-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="accfill"/></marker></defs><text class="s" x="15" y="26">Change request</text><rect class="box" x="15" y="40" width="170" height="60" rx="6"/><text class="t" x="100.0" y="67.0" text-anchor="middle">npm run change</text><text class="s" x="100.0" y="83.0" text-anchor="middle">“add a tip line…”</text><rect class="box" x="235" y="40" width="170" height="60" rx="6"/><text class="t" x="320.0" y="67.0" text-anchor="middle">Change agent</text><text class="s" x="320.0" y="83.0" text-anchor="middle">Claude Code · CodeBuild</text><rect class="box" x="455" y="40" width="170" height="60" rx="6"/><text class="t" x="540.0" y="67.0" text-anchor="middle">proposed</text><text class="s" x="540.0" y="83.0" text-anchor="middle">CodeCommit branch</text><rect class="box" x="675" y="40" width="170" height="60" rx="6"/><text class="t" x="760.0" y="67.0" text-anchor="middle">Your own commit</text><text class="s" x="760.0" y="83.0" text-anchor="middle">git push</text><polyline class="ln " points="185,70 235,70" marker-end="url(#cd)"/><text class="l " x="210" y="62" text-anchor="middle">asks</text><polyline class="ln " points="405,70 455,70" marker-end="url(#cd)"/><text class="l " x="430" y="62" text-anchor="middle">pushes</text><polyline class="ln " points="675,70 625,70" marker-end="url(#cd)"/><text class="l " x="650" y="62" text-anchor="middle">pushes</text><text class="s acc" x="320.0" y="116" text-anchor="middle">IAM: may push only to proposed</text><polyline class="ln " points="540.0,100 540.0,150 100.0,150 100.0,222" marker-end="url(#cd)"/><text class="l " x="548.0" y="140" text-anchor="start">triggers a release</text><rect class="zone" x="5" y="188" width="1070" height="112" rx="10"/><text class="s" x="235" y="206">CodePipeline · one release at a time · every step checks it has the tree Verify tested</text><rect class="box" x="15" y="222" width="170" height="60" rx="6"/><text class="t" x="100.0" y="249.0" text-anchor="middle">Verify</text><text class="s" x="100.0" y="265.0" text-anchor="middle">tests · build · synth</text><rect class="box" x="235" y="222" width="170" height="60" rx="6"/><text class="t" x="320.0" y="249.0" text-anchor="middle">Staging</text><text class="s" x="320.0" y="265.0" text-anchor="middle">deploy + smoke test</text><rect class="box acc" x="455" y="222" width="170" height="60" rx="6"/><text class="t" x="540.0" y="249.0" text-anchor="middle">Review</text><text class="s" x="540.0" y="265.0" text-anchor="middle">a person approves</text><rect class="box" x="675" y="222" width="170" height="60" rx="6"/><text class="t" x="760.0" y="249.0" text-anchor="middle">Production</text><text class="s" x="760.0" y="265.0" text-anchor="middle">deploy</text><rect class="box" x="895" y="222" width="170" height="60" rx="6"/><text class="t" x="980.0" y="249.0" text-anchor="middle">main</text><text class="s" x="980.0" y="265.0" text-anchor="middle">moves to the release</text><polyline class="ln " points="185,252 235,252" marker-end="url(#cd)"/><text class="l " x="210" y="244" text-anchor="middle">green</text><polyline class="ln " points="405,252 455,252" marker-end="url(#cd)"/><text class="l " x="430" y="244" text-anchor="middle">live</text><polyline class="ln acc" points="625,252 675,252" marker-end="url(#cd-acc)"/><text class="l acc" x="650" y="244" text-anchor="middle">yes</text><polyline class="ln " points="845,252 895,252" marker-end="url(#cd)"/><text class="l " x="870" y="244" text-anchor="middle">done</text><polyline class="ln dash" points="540.0,282 540.0,322" marker-end="url(#cd)"/><text class="l" x="548.0" y="318">rejected: production and main unchanged</text></svg>
