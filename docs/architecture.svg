<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-label="Runtime architecture: the assistant can only propose; terms and payments are written only when Jordan clicks confirm or approve, through the API, never through the agent."><title>Runtime architecture: the assistant can only propose; terms and payments are written only when Jordan clicks confirm or approve, through the API, never through the agent.</title><style>
svg{color:#18221f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.box{fill:#ffffff;stroke:#5b6a65;stroke-width:1}
.box.acc{fill:#e2efeb;stroke:#1f6b5c;stroke-width:1.6}
.zone{fill:none;stroke:#5b6a65;stroke-opacity:.6;stroke-dasharray:6 5;stroke-width:1.2}
.t{font-size:13px;font-weight:600;fill:currentColor}
.s{font-size:11px;fill:#5b6a65}
.l{font-size:11px;fill:currentColor}
.acc.s,.acc.l{fill:#1f6b5c;font-weight:600}
.ln{fill:none;stroke:currentColor;stroke-width:1.2}
.ln.acc{stroke:#1f6b5c;stroke-width:2.2}
.ln.dash{stroke-dasharray:5 4}
.accfill{fill:#1f6b5c}
@media (prefers-color-scheme: dark){
svg{color:#e3ebe8}
.box{fill:#18211e;stroke:#94a59f}
.box.acc{fill:#1d3530;stroke:#6cc4ae}
.zone{stroke:#94a59f}
.s{fill:#94a59f}
.acc.s,.acc.l{fill:#6cc4ae}
.ln.acc{stroke:#6cc4ae}
.accfill{fill:#6cc4ae}
}
</style><defs><marker id="rt" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker><marker id="rt-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="accfill"/></marker></defs><rect class="zone" x="198" y="6" width="876" height="508" rx="10"/><text class="s" x="212" y="502">AWS account · one CDK stack · npm run deploy / destroy</text><rect class="box acc" x="20" y="220" width="150" height="80" rx="6"/><text class="t" x="95.0" y="257.0" text-anchor="middle">Jordan</text><text class="s" x="95.0" y="273.0" text-anchor="middle">browser · React app</text><rect class="box" x="214" y="20" width="170" height="56" rx="6"/><text class="t" x="299.0" y="45.0" text-anchor="middle">CloudFront + S3</text><text class="s" x="299.0" y="61.0" text-anchor="middle">static web app</text><rect class="box" x="214" y="110" width="170" height="56" rx="6"/><text class="t" x="299.0" y="135.0" text-anchor="middle">Cognito</text><text class="s" x="299.0" y="151.0" text-anchor="middle">1 user · no sign-up</text><rect class="box" x="214" y="232" width="170" height="56" rx="6"/><text class="t" x="299.0" y="257.0" text-anchor="middle">API Gateway</text><text class="s" x="299.0" y="273.0" text-anchor="middle">JWT on every route</text><rect class="box" x="444" y="110" width="170" height="56" rx="6"/><text class="t" x="529.0" y="135.0" text-anchor="middle">S3 uploads</text><text class="s" x="529.0" y="151.0" text-anchor="middle">original screenshots</text><rect class="box" x="444" y="232" width="170" height="56" rx="6"/><text class="t" x="529.0" y="257.0" text-anchor="middle">Lambda · API</text><text class="s" x="529.0" y="273.0" text-anchor="middle">14 routes</text><rect class="box" x="444" y="392" width="170" height="56" rx="6"/><text class="t" x="529.0" y="417.0" text-anchor="middle">Lambda · chat job</text><text class="s" x="529.0" y="433.0" text-anchor="middle">async, UI polls</text><rect class="box acc" x="720" y="232" width="160" height="56" rx="6"/><text class="t" x="800.0" y="257.0" text-anchor="middle">Household service</text><text class="s" x="800.0" y="273.0" text-anchor="middle">+ bill checker (code)</text><rect class="box" x="720" y="392" width="160" height="56" rx="6"/><text class="t" x="800.0" y="417.0" text-anchor="middle">Strands agent</text><text class="s" x="800.0" y="433.0" text-anchor="middle">7 tools</text><rect class="box" x="930" y="232" width="140" height="56" rx="6"/><text class="t" x="1000.0" y="257.0" text-anchor="middle">DynamoDB</text><text class="s" x="1000.0" y="273.0" text-anchor="middle">records · audit</text><rect class="box" x="930" y="342" width="140" height="56" rx="6"/><text class="t" x="1000.0" y="367.0" text-anchor="middle">Claude Opus 4.6</text><text class="s" x="1000.0" y="383.0" text-anchor="middle">Bedrock Converse</text><rect class="box" x="930" y="442" width="140" height="56" rx="6"/><text class="t" x="1000.0" y="467.0" text-anchor="middle">AgentCore Memory</text><text class="s" x="1000.0" y="483.0" text-anchor="middle">chat + long-term</text><polyline class="ln " points="60,220 60,48 214,48" marker-end="url(#rt)"/><text class="l " x="70" y="40" text-anchor="start">loads app</text><polyline class="ln " points="110,220 110,138 214,138" marker-end="url(#rt)"/><text class="l " x="120" y="130" text-anchor="start">signs in</text><polyline class="ln " points="170,260 214,260" marker-end="url(#rt)"/><text class="l " x="192" y="252" text-anchor="middle">JWT</text><polyline class="ln " points="384,260 444,260" marker-end="url(#rt)"/><text class="l " x="414.0" y="252" text-anchor="middle">calls</text><polyline class="ln " points="529.0,232 529.0,166" marker-end="url(#rt)"/><text class="l " x="537.0" y="194" text-anchor="start">stores</text><polyline class="ln " points="529.0,288 529.0,392" marker-end="url(#rt)"/><text class="l " x="537.0" y="34